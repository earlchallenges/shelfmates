# Keeps the free Supabase database from being paused for inactivity.
# Runs by itself every 3 days. Nothing to do by hand.
name: Keep database awake

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Shelfmates database
        env:
          URL: https://goktlyjoorstbponqfjs.supabase.co
          KEY: sb_publishable_z3vYRTVmnKoosixOzazX6w_mWvXMJEs
        run: |
          for t in profiles notices friendships; do
            curl -sS -o /dev/null -w "$t %{http_code}\n" "$URL/rest/v1/$t?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          done

      - uses: actions/checkout@v4

      # GitHub turns off scheduled jobs after 60 days with no commits.
      # A tiny monthly commit keeps this job switched on.
      - name: Monthly heartbeat commit
        run: |
          if [ "$(date -u +%d)" -le 3 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p .github
            date -u > .github/last-keepalive.txt
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-keepalive.txt
            git commit -m "Monthly keep-alive" || exit 0
            git push
          fi
