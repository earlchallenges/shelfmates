<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelfmates</title>
<meta name="description" content="See what your friends are reading. Share your top books by genre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,50&family=Source+Sans+3:ital,wght@0,400..700;1,400&display=swap">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <a class="brand" href="#/shelf"><span class="brand-mark">S</span><span>Shelfmates</span></a>
    <nav class="nav" id="nav" hidden>
      <a href="#/shelf" data-nav="shelf">My Shelf</a>
      <a href="#/friends" data-nav="friends">Friends</a>
      <a href="#/badges" data-nav="badges">Badges</a>
      <a href="#/card" data-nav="card">My Card</a>
    </nav>
    <div class="topbar-right" id="topbar-right" hidden>
      <button class="bell" id="bell" title="Notices" aria-label="Notices">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="bell-dot" id="bell-dot" hidden></span>
      </button>
      <a class="coins" href="#/profile" id="coins" title="Coins and level"></a>
      <a class="me" href="#/profile" id="me-chip"></a>
    </div>
  </header>
  <main id="main" class="main"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="notices" class="notices" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
</html>
